<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather APP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">

</head>
<body>
    <div id="wrapper">
        <div class="input-box">
            <input id="input" type="text" placeholder="Search a city">
            <i class="ri-search-line" id="search-icon"></i>
        </div>
        <div class="result-box">
            <img src="" id="img" alt="image">
            <h2 ><span id="temp">30</span><i class="ri-celsius-fill"></i></h2>
            <p id="text">Light rain</p>
            <p><span id="city">Patna</span>, <span id="country">India</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
